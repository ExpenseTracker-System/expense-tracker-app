name: expense_tracker
description: "محفظتي الذكية - تطبيق إدارة المصاريف والمحافظ المتعددة مع المزامنة السحابية"
publish_to: "none"

version: 2.0.0+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  provider: ^6.1.2
  pie_chart: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
